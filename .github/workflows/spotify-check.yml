name: Spotify check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/spotify-check.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - run: |
          git config user.name comet-links-bot; git config user.email comet-links-bot@users.noreply.github.com
          git add data/spotify-check.log && git commit -m "Spotify check log" && git pull --rebase -q && git push
